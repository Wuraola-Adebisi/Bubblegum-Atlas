<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 248" role="img" aria-labelledby="hotel-title"><title id="hotel-title">A four-storey guest hotel with a lit sign</title><style>.hotel-wall{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-park, #A8DEC3))}.hotel-wall-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-park, #A8DEC3) 86%, var(--color-ink, #1F2F6B)))}.hotel-wall-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-park, #A8DEC3) 60%, #fff))}.hotel-roof{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-accent, #B0306B))}.hotel-roof-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-accent, #B0306B) 86%, var(--color-ink, #1F2F6B)))}.hotel-roof-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-accent, #B0306B) 60%, #fff))}.hotel-door{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-flag, #FF9B54))}.hotel-door-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-flag, #FF9B54) 86%, var(--color-ink, #1F2F6B)))}.hotel-door-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-flag, #FF9B54) 60%, #fff))}.hotel-awn{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-accent, #B0306B))}.hotel-awn-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-accent, #B0306B) 86%, var(--color-ink, #1F2F6B)))}.hotel-awn-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-accent, #B0306B) 60%, #fff))}.hotel-win{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-water, #BFE4F0))}.hotel-win-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-water, #BFE4F0) 86%, var(--color-ink, #1F2F6B)))}.hotel-win-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-water, #BFE4F0) 60%, #fff))}.hotel-sign{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-paper, #FFFFFF))}.hotel-sign-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-paper, #FFFFFF) 86%, var(--color-ink, #1F2F6B)))}.hotel-sign-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-paper, #FFFFFF) 60%, #fff))}.hotel-glow{fill:var(--color-glow, #FFE08A);opacity:var(--scene-glow,0)}.hotel-halo{fill:var(--color-glow, #FFE08A);opacity:calc(var(--scene-halo,0) * .45);stroke:none}</style><defs><clipPath id="hotel-c1"><rect x="24" y="52" width="136" height="180" rx="8" /></clipPath><clipPath id="hotel-c2"><rect x="14" y="38" width="156" height="20" rx="7" /></clipPath><clipPath id="hotel-c3"><rect x="76" y="186" width="32" height="46" rx="16" /></clipPath><clipPath id="hotel-c4"><rect x="60" y="176" width="64" height="14" rx="6" /></clipPath></defs><g transform="translate(8 8)"><rect x="24" y="52" width="136" height="180" rx="8" class="hotel-wall"/><g clip-path="url(#hotel-c1)"><rect class="hotel-wall-h" x="24" y="52" width="136" height="18.0"/><rect class="hotel-wall-h" x="24" y="52" width="9.5" height="180"/><rect class="hotel-wall-s" x="124.6" y="52" width="37.4" height="180"/><rect class="hotel-wall-s" x="24" y="206.8" width="136" height="27.2"/></g><rect x="24" y="52" width="136" height="1