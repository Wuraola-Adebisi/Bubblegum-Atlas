<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 296 192" role="img" aria-labelledby="marquee-title"><title id="marquee-title">A reception marquee strung with glowing lights</title><style>.marquee-wall{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-paper, #FFFFFF))}.marquee-wall-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-paper, #FFFFFF) 86%, var(--color-ink, #1F2F6B)))}.marquee-wall-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-paper, #FFFFFF) 60%, #fff))}.marquee-roof{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-accent, #B0306B))}.marquee-roof-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-accent, #B0306B) 86%, var(--color-ink, #1F2F6B)))}.marquee-roof-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-accent, #B0306B) 60%, #fff))}.marquee-stripe{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-paper, #FFFFFF))}.marquee-stripe-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-paper, #FFFFFF) 86%, var(--color-ink, #1F2F6B)))}.marquee-stripe-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-paper, #FFFFFF) 60%, #fff))}.marquee-door{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-flag, #FF9B54))}.marquee-door-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-flag, #FF9B54) 86%, var(--color-ink, #1F2F6B)))}.marquee-door-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-flag, #FF9B54) 60%, #fff))}.marquee-mast{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-ink, #1F2F6B))}.marquee-mast-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-ink, #1F2F6B) 86%, var(--color-ink, #1F2F6B)))}.marquee-mast-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-ink, #1F2F6B) 60%, #fff))}.marquee-pennant{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-glow, #FFE08A))}.marquee-pennant-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-glow, #FFE08A) 86%, var(--color-ink, #1F2F6B)))}.marquee-pennant-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-glow, #FFE08A) 60%, #fff))}.marquee-win{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-water, #BFE4F0))}.marquee-win-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-water, #BFE4F0) 86%, var(--color-ink, #1F2F6B)))}.marquee-win-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-water, #BFE4F0) 60%, #fff))}.marquee-bulb{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-paper, #FFFFFF))}.marquee-bulb-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-paper, #FFFFFF) 86%, var(--color-ink, #1F2F6B)))}.marquee-bulb-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-paper, #FFFFFF) 60%, #fff))}.marquee-glow{fill:var(--color-glow, #FFE08A);opacity:var(--scene-glow,0)}.marquee-halo{fill:var(--color-glow, #FFE08A);opacity:calc(var(--scene-halo,0) * .45);stroke:none}</style><defs><clipPath id="marquee-c1"><rect x="22" y="94" width="244" height="74" rx="6" /></clipPath><clipPath id="marquee-c2"><path d="M8 98 L144 22 L280 98 Z" /></clipPath><clipPath id="marquee-c3"><path d="M118 168 L118 144 Q118 118 144 118 Q170 118 170 144 L170 168 Z" /></clipPath></defs><g transform="translate(8 8)"><rect x="142" y="4" width="3" height="20" rx="1.5" class="marquee-mast"/><rect x="142" y="4" width="3" height="20" rx="1.5" fill="none" stroke="var(--color-accent, #B0306B)" stroke-width="1.5px" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="M145 6 L168 12 L145 18 Z" class="marquee-pennant"/><path d="M145 6 L168 12 L145 18 Z" fill="none" stroke="var(--color-accent, #B0306B)" stroke-width="1.5px" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><rect x="22" y="94" width="244" height="74" rx="6" class="marquee-wall"/><g clip-path="url(#marquee-c1)"><rect class="marquee-wall-h" x="22" y="94" width="244" height="7.4"/><rect class="marquee-wall-h" x="22" y="94" width="17.1" height="74"/><rect class="marquee-wall-s" x="202.6" y="94" width="65.4" height="74"/><rect class="marquee-wall-s" x="22" y="157.6" width="244" height="12.4"/></g><rect x="22" y="94" width="244" height="74" rx="6" fill="none" stroke="var(--color-accent, #B0306B)" stroke-width="1.5px" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="M8 98 L144 22 L280 98 Z" class="marquee-roof"/><g clip-path="url(#marquee-c2)"><rect class="marquee-roof-h" x="8" y="22" width="272" height="7.6"/><rect class="marquee-roof-h" x="8" y="22" width="19.0" height="76"/><rect class="marquee-roof-s" x="209.3" y="22" width="72.7" height="76"/><rect class="marquee-roof-s" x="8" y="87.4" width="272" height="12.6"/></g><path d="M8 98 L144 22 L280 98 Z" fill="none" stroke="var(--color