<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 114" role="img" aria-labelledby="shuttle-title"><title id="shuttle-title">A wedding shuttle bus with lit windows</title><style>.shuttle-body{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-flag, #FF9B54))}.shuttle-body-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-flag, #FF9B54) 86%, var(--color-ink, #1F2F6B)))}.shuttle-body-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-flag, #FF9B54) 60%, #fff))}.shuttle-stripe{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-paper, #FFFFFF))}.shuttle-stripe-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-paper, #FFFFFF) 86%, var(--color-ink, #1F2F6B)))}.shuttle-stripe-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-paper, #FFFFFF) 60%, #fff))}.shuttle-win{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-water, #BFE4F0))}.shuttle-win-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-water, #BFE4F0) 86%, var(--color-ink, #1F2F6B)))}.shuttle-win-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-water, #BFE4F0) 60%, #fff))}.shuttle-wheel{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-ink, #1F2F6B))}.shuttle-wheel-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-ink, #1F2F6B) 86%, var(--color-ink, #1F2F6B)))}.shuttle-wheel-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) cal