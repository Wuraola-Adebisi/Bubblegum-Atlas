<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 184" role="img" aria-labelledby="cafe-title"><title id="cafe-title">A lakeside cafe with a striped awning and an outdoor table</title><style>.cafe-wall{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-land-strong, #FF8FB8))}.cafe-wall-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-land-strong, #FF8FB8) 86%, var(--color-ink, #1F2F6B)))}.cafe-wall-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-land-strong, #FF8FB8) 60%, #fff))}.cafe-roof{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-accent, #B0306B))}.cafe-roof-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-accent, #B0306B) 86%, var(--color-ink, #1F2F6B)))}.cafe-roof-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-accent, #B0306B) 60%, #fff))}.cafe-awn{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-accent, #B0306B))}.cafe-awn-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-accent, #B0306B) 86%, var(--color-ink, #1F2F6B)))}.cafe-awn-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-accent, #B0306B) 60%, #fff))}.cafe-stripe{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-paper, #FFFFFF))}.cafe-stripe-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-paper, #FFFFFF) 86%, var(--color-ink, #1F2F6B)))}.cafe-stripe-h{fill:color-mix(in oklab, var(--scene-night, #1E245