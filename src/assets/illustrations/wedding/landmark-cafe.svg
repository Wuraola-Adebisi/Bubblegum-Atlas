--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-paper, #FFFFFF))}.cafe-bulb-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-paper, #FFFFFF) 86%, var(--color-ink, #1F2F6B)))}.cafe-bulb-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-paper, #FFFFFF) 60%, #fff))}.cafe-glow{fill:var(--color-glow, #FFE08A);opacity:var(--scene-glow,0)}.cafe-halo{fill:var(--color-glow, #FFE08A);opacity:calc(var(--scene-halo,0) * .45);stroke:none}</style><defs><clipPath id="cafe-c1"><rect x="8" y="62" width="168" height="98" rx="8" /></clipPath><clipPath id="cafe-c2"><rect x="2" y="48" width="180" height="20" rx="8" /></clipPath><clipPath id="cafe-c3"><rect x="8" y="74" width="168" height="24" rx="6" /></clipPath><clipPath id="cafe-c4"><rect x="112" y="106" width="44" height="54" rx="22" /></clipPath></defs><g transform="translate(8 8)"><rect x="8" y="62" width="168" height="98" rx="8" class="cafe-wall"/><g clip-path="url(#cafe-c1)"><rect class="cafe-wall-h" x="8" y="62" width="168" height="9.8"/><rect class="cafe-wall-h" x="8" y="62" width="11.8" height="98"/><rect class="cafe-wall-s" x="132.3" y="62" width="45.7" height="98"/><rect class="cafe-wall-s" x="8" y="146.3" width="168" height="15.7"/></g><rect x="8" y="62" width="168" height="98" rx="8" fill="none" stroke="var(--color-accent, #B0306B)" stroke-width="1.5px" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><rect x="2" y="48" width="180" height="20" rx="8" class="cafe-roof"/><g clip-path="url(#cafe-c2)"><rect class="cafe-roof-h" x="2" y="48" width="180" height="2.0"/><rect class="cafe-roof-h" x="2" y="48" width="12.6" height="20"/><rect class="cafe-roof-s" x="135.2" y="48" width="48.8" height="20"/><rect class="cafe-roof-s" x="2" y="65.2" width="180" height="4.8"/></g><rect x="2" y="48" width="180" height="20" rx="8" fill="none" stroke="var(--color-accent,