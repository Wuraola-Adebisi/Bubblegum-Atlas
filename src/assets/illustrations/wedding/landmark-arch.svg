<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 204" role="img" aria-labelledby="arch-title"><title id="arch-title">A ceremony arch covered in pink and orange flowers</title><style>.arch-post{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-paper, #FFFFFF))}.arch-post-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-paper, #FFFFFF) 86%, var(--color-ink, #1F2F6B)))}.arch-post-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-paper, #FFFFFF) 60%, #fff))}.arch-bloom{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-land-strong, #FF8FB8))}.arch-bloom-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-land-strong, #FF8FB8) 86%, var(--color-ink, #1F2F6B)))}.arch-bloom-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-land-strong, #FF8FB8) 60%, #fff))}.arch-bloom2{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-flag, #FF9B54))}.arch-bloom2-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-flag, #FF9B54) 86%, var(--color-ink, #1F2F6B)))}.arch-bloom2-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-flag, #FF9B54) 60%, #fff))}.arch-bloom3{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-glow, #FFE08A))}.arch-bloom3-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-glow, #FFE08A) 86%, var(--color-ink, #1F2F6B)))}.arch-bloom3-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc