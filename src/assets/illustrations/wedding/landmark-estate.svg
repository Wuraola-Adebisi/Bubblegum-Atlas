<svg xmlns="http://www.w3.org/2000/svg" class="piece-estate" viewBox="0 0 336 226" role="img" aria-labelledby="estate-title"><title id="estate-title">A lakeside estate house with a berry roof and glowing windows</title><style>.piece-estate :where(path,rect,circle,ellipse){stroke:var(--color-accent, #B0306B);stroke-width:var(--ba-line-w,1.5px);stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}.estate-wall{fill:color-mix(in oklab, var(--color-water-deep, #6F8FDB) 32%, #fff)}.estate-roof{fill:color-mix(in oklab, var(--color-land, #FFC9DB) 55%, #fff)}.estate-roofmain{fill:var(--color-land-strong, #FF8FB8)}.estate-trim{fill:color-mix(in oklab, var(--color-paper, #FFFFFF) 32%, #fff)}.estate-door{fill:var(--color-flag, #FF9B54)}.estate-chimney{fill:color-mix(in oklab, var(--color-land-strong, #FF8FB8) 32%, #fff)}.estate-win{fill:color-mix(in oklab, var(--color-water, #BFE4F0) 32%, #fff)}.estate-mast{fill:color-mix(in oklab, var(--color-ink, #1F2F6B) 32%, #fff)}.estate-flag{fill:var(--color-glow, #FFE08A)}.estate-glow{fill:var(--color-glow, #FFE08A);opacity:var(--scene-glow,0);stroke:none}.estate-hatch{fill:none;stroke-width:1px;opacity:.55}.estate-wave{fill:none;stroke:var(--color-water-deep, #6F8FDB)}</style><defs></defs><g transform="translate(8 8)"><rect x="158" y="2" width="3" height="26" rx="1.5" class="estate-mast"/><path d="M161 4 L186 10 L161 16 Z" class="estate-flag"/><rect x="196" y="30" width="18" height="38" rx="3" class="estate-chimney"/><rect x="14" y="120" width="92" height="84" rx="6" class="estate-wall"/><rect x="214" y="120" width="92" height="84" rx="6" class="estate-wall"/><rect x="84" y="84" width="152" height="120" rx="8" class="estate-wall"/><path d="M6 124 L30 92 L90 92 L114 124 Z" class="estate-roof"/><path d="M206 124 L230 92 L290 92 L314 124 Z" class="estate-roof"/><path d="M70 92 L160 24 L250 92 Z" class="estate-roofmain"/><circle class="estate-win" cx="160" cy="66" r="11"/><circle class="estate-glow" cx="160" cy="66" r