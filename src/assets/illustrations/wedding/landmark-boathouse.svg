<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 200" role="img" aria-labelledby="boathouse-title"><title id="boathouse-title">A lakeside boathouse with a berry roof and a lit terrace</title><style>.boathouse-wall{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-water-deep, #6F8FDB))}.boathouse-wall-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-water-deep, #6F8FDB) 86%, var(--color-ink, #1F2F6B)))}.boathouse-wall-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-water-deep, #6F8FDB) 60%, #fff))}.boathouse-roof{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-accent, #B0306B))}.boathouse-roof-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-accent, #B0306B) 86%, var(--color-ink, #1F2F6B)))}.boathouse-roof-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-accent, #B0306B) 60%, #fff))}.boathouse-door{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-flag, #FF9B54))}.boathouse-door-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-flag, #FF9B54) 86%, var(--color-ink, #1F2F6B)))}.boathouse-door-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-flag, #FF9B54) 60%, #fff))}.boathouse-deck{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-paper, #FFFFFF))}.boathouse-deck-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-paper, #FFFFFF) 86%, var(--color-ink, #1F2F6B)))}.boathouse-d