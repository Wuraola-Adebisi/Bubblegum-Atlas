<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 128" role="img" aria-labelledby="jetty-title"><title id="jetty-title">A wooden jetty with glowing lamp posts</title><style>.jetty-deck{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-land, #FFC9DB))}.jetty-deck-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-land, #FFC9DB) 86%, var(--color-ink, #1F2F6B)))}.jetty-deck-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-land, #FFC9DB) 60%, #fff))}.jetty-post{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-accent, #B0306B))}.jetty-post-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-accent, #B0306B) 86%, var(--color-ink, #1F2F6B)))}.jetty-post-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-accent, #B0306B) 60%, #fff))}.jetty-bulb{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-paper, #FFFFFF))}.jetty-bulb-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-paper, #FFFFFF) 86%, var(--color-ink, #1F2F6B)))}.jetty-bulb-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-paper, #FFFFFF) 60%, #fff))}.jetty-glow{fill:var(--color-glow, #FFE08A);opacity:var(--scene-glow,0)}.jetty-halo{fill:var(--color-glow, #FFE08A);opacity:calc(var(--scene-halo,0) * .45);stroke:none}</style><defs><clipPath id="jetty-c1"><rect x="8" y="40" width="268" height="18" rx="6" /></clipPath></defs><g transform="translate(8 8)"><rect x="24" y="52" width="8" height="46" rx="3" class="jetty-post"/><rect x="24" y="52" width="8" he