<svg xmlns="http://www.w3.org/2000/svg" class="piece-ferry" viewBox="0 0 270 190" role="img" aria-labelledby="ferry-title"><title id="ferry-title">A pink and berry passenger ferry with a glowing cabin</title><style>.piece-ferry :where(path,rect,circle,ellipse){stroke:var(--color-ink, #1F2F6B);stroke-width:var(--ba-line-w,1.5px);stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}.ferry-hull{fill:color-mix(in oklab, var(--color-land, #FFC9DB) 55%, #fff)}.ferry-stripe{fill:color-mix(in oklab, var(--color-paper, #FFFFFF) 32%, #fff)}.ferry-cabin{fill:color-mix(in oklab, var(--color-land, #FFC9DB) 32%, #fff)}.ferry-bridge{fill:color-mix(in oklab, var(--color-water, #BFE4F0) 32%, #fff)}.ferry-funnel{fill:var(--color-flag, #FF9B54)}.ferry-band{fill:var(--color-accent, #B0306B)}.ferry-win{fill:color-mix(in oklab, var(--color-water-deep, #6F8FDB) 32%, #fff)}.ferry-mast{fill:color-mix(in oklab, var(--color-ink, #1F2F6B) 32%, #fff)}.ferry-pennant{fill:var(--color-glow, #FFE08A)}.ferry-glow{fill:var(--color-glow, #FFE08A);opacity:var(--scene-glow,0);stroke:none}.ferry-hatch{fill:none;stroke-width:1px;opacity:.55}.ferry-wave{fill:none;stroke:var(--color-water-deep, #6F8FDB)}</style><defs></defs><g transform="translate(8 8)"><rect x="58" y="26" width="4" height="42" rx="2" class="ferry-mast"/><path d="M62 28 L92 37 L62 46 Z" class="ferry-pennant"/><rect x="128" y="8" width="26" height="32" rx="5" class="ferry-funnel"/><rect x="128" y="16" width="26" height="8" rx="0" class="ferry-band"/><rect x="98" y="34" width="86" height="36" rx="10" class="ferry-bridge"/><rect x="108" y="44" width="66" height="14" rx="6" class="ferry-win"/><rect class="ferry-glow" x="108" y="44" width="66" height="14" rx="6"/><rect x="46" y="64" width="172" height="38" rx="10" class="ferry-cabin"/><rect x="64" y="74" width="20" height="17" rx="6" class="ferry-win"/><rect class="ferry-glow" x="64" y="74" width="20" height="17" rx="6"/><rect x="94" y="74" width="20" height="17" rx="6" class="ferry-win"/><rect class="ferry-glow" x="94" y="74" width="20" height="17" rx="6"/><rect x="124" y="74" width="20" height="17" rx="6" class="ferry-win"/><rect class="ferry-glow" x="124" y="74" width="20" height="17" rx="6"/><rect x="154" y="74" width="20" height="17" rx="6" class="ferry-win"/><rect class="ferry-glow" x="154" y="74" width="20" height="17" rx="6"/><rect x="184" y="74" width="20" height="17" rx="6" class="ferry-win"/><rect class="ferry-glow" x="184" y="74" width="20" height="17" rx="6"/><path d="M16 98 L248 98 L227 143 Q223 151 213 151 L51 151 Q41 151 37 143 Z" class="ferry-hull"/><rect x="30" y="111" width="208" height="9" rx="4" class="ferry-stripe"/><circle cx="62" cy="135" r="5" class="ferry-win"/><circle cx="94" cy="135" r="5" class="ferry-win"/><circle cx="126" cy="135" r="5" class="ferry-win"/><circle cx="158" cy="135" r="5" class="ferry-win"/><circle cx="190" cy="135" r="5" class="ferry-win"/><path class="ferry-wave" d="M12 158 q12 -9 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0"/><path class="ferry-wave" d="M48 166 q12 -9 24 0 t24 0 t24 0 t24 0 t24 0 t24 0"/></g></svg>