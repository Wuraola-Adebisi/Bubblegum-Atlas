<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 190" role="img" aria-labelledby="ferry-title"><title id="ferry-title">A pink and berry passenger ferry with a glowing cabin</title><style>.ferry-hull{fill:var(--color-accent, #B0306B)}.ferry-hull-s{fill:color-mix(in oklab, var(--color-accent, #B0306B) 86%, var(--color-ink, #1F2F6B))}.ferry-hull-h{fill:color-mix(in oklab, var(--color-accent, #B0306B) 60%, #fff)}.ferry-stripe{fill:var(--color-paper, #FFFFFF)}.ferry-stripe-s{fill:color-mix(in oklab, var(--color-paper, #FFFFFF) 86%, var(--color-ink, #1F2F6B))}.ferry-stripe-h{fill:color-mix(in oklab, var(--color-paper, #FFFFFF) 60%, #fff)}.ferry-cabin{fill:var(--color-land, #FFC9DB)}.ferry-cabin-s{fill:color-mix(in oklab, var(--color-land, #FFC9DB) 86%, var(--color-ink, #1F2F6B))}.ferry-cabin-h{fill:color-mix(in oklab, var(--color-land, #FFC9DB) 60%, #fff)}.ferry-bridge{fill:var(--color-water, #BFE4F0)}.ferry-bridge-s{fill:color-mix(in oklab, var(--color-water, #BFE4F0) 86%, var(--color-ink, #1F2F6B))}.ferry-bridge-h{fill:color-mix(in oklab, var(--color-water, #BFE4F0) 60%, #fff)}.ferry-funnel{fill:var(--color-flag, #FF9B54)}.ferry-funnel-s{fill:color-mix(in oklab, var(--color-flag, #FF9B54) 86%, var(--color-ink, #1F2F6B))}.ferry-funnel-h{fill:color-mix(in oklab, var(--color-flag, #FF9B54) 60%, #fff)}.ferry-band{fill:var(--color-accent, #B0306B)}.ferry-band-s{fill:color-mix(in oklab, var(--color-accent, #B0306B) 86%, var(--color-ink, #1F2F6B))}.ferry-band-h{fill:color-mix(in oklab, var(--color-accent, #B0306B) 60%, #fff)}.ferry-win{fill:var(--color-water-deep, #6F8FDB)}.ferry-win-s{fill:color-mix(in oklab, var(--color-water-deep, #6F8FDB) 86%, var(--color-ink, #1F2F6B))}.ferry-win-h{fill:color-mix(in oklab, var(--color-water-deep, #6F8FDB) 60%, #fff)}.ferry-mast{fill:var(--color-ink, #1F2F6B)}.ferry-mast-s{fill:color-mix(in oklab, var(--color-ink, #1F2F6B) 86%, var(--color-ink, #1F2F6B))}.ferry-mast-h{fill:color-mix(in oklab, var(--color-ink, #1F2F6B) 60%, #fff)}.f