<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 142" role="img" aria-labelledby="tree-title"><title id="tree-title">A round lollipop tree</title><style>.tree-leaf{fill:var(--color-park-deep, #17935F)}.tree-leaf-s{fill:color-mix(in oklab, var(--color-park-deep, #17935F) 86%, var(--color-ink, #1F2F6B))}.tree-leaf-h{fill:color-mix(in oklab, var(--color-park-deep, #17935F) 60%, #fff)}.tree-trunk{fill:var(--color-ink, #1F2F6B)}.tree-trunk-s{fill:color-mix(in oklab, var(--color-ink, #1F2F6B) 86%, var(--color-ink, #1F2F6B))}.tree-trunk-h{fill:color-mix(in oklab, var(--color-ink, #1F2F6B) 60%, #fff)}.tree-dot{fill:var(--color-park, #A8DEC3)}.tree-dot-s{fill:color-mix(in oklab, var(--color-park, #A8DEC3) 86%, var(--color-ink, #1F2F6B))}.tree-dot-h{fill:color-mix(in oklab, var(--color-park, #A8DEC3) 60%, #fff)}.tree-glow{fill:var(--color-glow, #FFE08A);opacity:var(--scene-glow,0)}</style><defs><clipPath id="tree-c1"><rect x="46" y="76" width="9" height="50" rx="4" /></clipPath><clipPath id="tree-c2"><circle cx="50" cy="46" r="38"/></clipPath></defs><g transform="translate(8 8)"><g class="tree-sticker" aria-hidden="true"><rect x="46" y="76" width="9" height="50" rx="4" fill="#fff" stroke="#fff" stroke-width="12" stroke-linejoin="round"/><circle cx="50" cy="46" r="38" fill="#fff" stroke="#fff" stroke-width="12"/></g><rect x="46" y="76" width="9" height="50" rx="4" class="tree-trunk"/><circle class="tree-leaf-s" cx="50" cy="46" r="38"/><g clip-path="url(#tree-c2)"><circle class="tree-leaf" cx="44.7" cy="39.9" r="38"/></g><circle class="tree-leaf-h" cx="34.8" cy="30.0" r="5.7"/><circle cx="34" cy="58" r="5" class="tree-dot"/><circle cx="62" cy="30" r="5" class="tree-dot"/><circle cx="68" cy="62" r="5" class="tree-dot"/></g></svg>