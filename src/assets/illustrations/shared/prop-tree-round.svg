<svg xmlns="http://www.w3.org/2000/svg" class="piece-tree" viewBox="0 0 112 142" role="img" aria-labelledby="tree-title"><title id="tree-title">A round lollipop tree</title><style>.piece-tree :where(path,rect,circle,ellipse){stroke:var(--color-park-deep, #17935F);stroke-width:var(--ba-line-w,1.5px);stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}.tree-leaf{fill:color-mix(in oklab, var(--color-park-deep, #17935F) 32%, #fff)}.tree-trunk{fill:color-mix(in oklab, var(--color-park-deep, #17935F) 32%, #fff)}.tree-dot{fill:var(--color-park, #A8DEC3)}.tree-glow{fill:var(--color-glow, #FFE08A);opacity:var(--scene-glow,0);stroke:none}.tree-hatch{fill:none;stroke-width:1px;opacity:.55}.tree-wave{fill:none;stroke:var(--color-water-deep, #6F8FDB)}</style><defs></defs><g transform="translate(8 8)"><rect x="46" y="76" width="9" height="50" rx="4" class="tree-trunk"/><circle class="tree-leaf" cx="50" cy="46" r="38"/><circle cx="34" cy="58" r="5" class="tree-dot"/><circle cx="62" cy="30" r="5" class="tree-dot"/><circle cx="68" cy="62" r="5" class="tree-dot"/></g></svg>