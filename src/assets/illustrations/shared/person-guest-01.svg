<svg xmlns="http://www.w3.org/2000/svg" class="piece-guest01" viewBox="0 0 64 112" role="img" aria-labelledby="guest01-title"><title id="guest01-title">A wedding guest in a berry dress with a hair bun</title><style>.piece-guest01 :where(path,rect,circle,ellipse){stroke:var(--color-accent, #B0306B);stroke-width:var(--ba-line-w,1.5px);stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}.guest01-skin{fill:var(--skin, #E3AE8A)}.guest01-hair{fill:var(--hair, #5A3A22)}.guest01-dress{fill:color-mix(in oklab, var(--color-land, #FFC9DB) 55%, #fff)}.guest01-shoe{fill:color-mix(in oklab, var(--color-ink, #1F2F6B) 32%, #fff)}.guest01-glow{fill:var(--color-glow, #FFE08A);opacity:var(--scene-glow,0);stroke:none}.guest01-hatch{fill:none;stroke-width:1px;opacity:.55}.guest01-wave{fill:none;stroke:var(--color-water-deep, #6F8FDB)}</style><defs></defs><g transform="translate(12 8)"><circle cx="24" cy="4" r="5.5" class="guest01-hair"/><circle cx="24" cy="15" r="11.5" class="guest01-hair"/><circle cx="24" cy="17" r="10" class="guest01-skin"/><rect x="5" y="32" width="7" height="28" rx="3.5" class="guest01-skin"/><rect x="36" y="32" width="7" height="28" rx="3.5" class="guest01-skin"/><rect x="16" y="62" width="7" height="26" rx="3.5" class="guest01-skin"/><rect x="25" y="62" width="7" height="26" rx="3.5" class="guest01-skin"/><ellipse cx="19.5" cy="90" rx="6.5" ry="3.5" class="guest01-shoe"/><ellipse cx="28.5" cy="90" rx="6.5" ry="3.5" class="guest01-shoe"/><path d="M13 30 Q24 25 35 30 L42 68 Q24 75 6 68 Z" class="guest01-dress"/></g></svg>