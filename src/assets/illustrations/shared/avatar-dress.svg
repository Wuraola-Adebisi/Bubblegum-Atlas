<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 112" role="img" aria-labelledby="avdress-title"><title id="avdress-title">A guest in a berry dress who walks as you scroll</title><style>.avdress-skin{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--skin, #E3AE8A))}.avdress-skin-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--skin, #E3AE8A) 86%, var(--color-ink, #1F2F6B)))}.avdress-skin-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--skin, #E3AE8A) 60%, #fff))}.avdress-hair{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--hair, #5A3A22))}.avdress-hair-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--hair, #5A3A22) 86%, var(--color-ink, #1F2F6B)))}.avdress-hair-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--hair, #5A3A22) 60%, #fff))}.avdress-dress{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-accent, #B0306B))}.avdress-dress-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-accent, #B0306B) 86%, var(--color-ink, #1F2F6B)))}.avdress-dress-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-accent, #B0306B) 60%, #fff))}.avdress-shoe{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-ink, #1F2F6B))}.avdress-shoe-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-ink, #1F2F6B) 86%, var(--color-ink, #1F2F6B)))}.avdress-shoe-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-ink, #1F2F6B) 60%, #fff))}.avdress-glow{fill:var(--color-glow, #FFE08A);opacity:var(--scene-glow,0)}.avdress-halo{fill:var(--color-glow, #FFE08A);opacity:calc(var(--scene-halo,0) * .45);stroke:none}</style><defs><clipPath id="avdress-c1"><path d="M13 30 Q24 25 35 30 L42 68 Q24 75 6 68 Z" /></clipPath></defs><g transform="translate(12 8)"><circle cx="24" cy="4" r="5.5" class="avdress-hair"/><circle cx="24" cy="4" r="5.5" fill="none" stroke="var(--color-accent, #B0306B)" stroke-width="1.5px" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><circle cx="24" cy="15" r="11.5" class="avdress-hair"/><circle cx="24" cy="15" r="11.5" fill="none" stroke="var(--color-accent, #B0306B)" stroke-width="1.5px" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><circle cx="24" cy="17" r="10" class="avdress-skin"/><circle cx="24" cy="17" r="10" fill="none" stroke="var(--color-accent, #B0306B)" stroke-width="1.5px" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><g class="av-arm av-arm-a"><rect x="5" y="32" width="7" height="28" rx="3.5" class="avdress-skin"/><rect x="5" y="32" width="7" height="28" rx="3.5" fill="none" stroke="var(--color-accent, #B0306B)" stroke-width="1.5px" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></g><g class="av-arm av-arm-b"><rect x="36" y="32" width="7" height="28" rx="3.5" class="avdress-skin"/><rect x="36" y="32" width="7" height="28" rx="3.5" fill="none" stroke="var(--color-accent, #B0306B)" stroke-width="1.5px" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></g><g class="av-leg av-leg-a"><rect x="16" y="62" width="7" height="26" rx="3.5" class="avdress-skin"/><rect x="16" y="62" width="7" height="26" rx="3.5" fill="none" stroke="var(--color-accent, #B0306B)" stroke-width="1.5px" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><ellipse cx="19.5" cy="90" rx="6.5" ry="3.5" class="avdress-shoe"/><ellipse cx="19.5" cy="90" rx="6.5" ry="3.5" fill="none" st