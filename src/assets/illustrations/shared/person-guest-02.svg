<svg xmlns="http://www.w3.org/2000/svg" class="piece-guest02" viewBox="0 0 64 112" role="img" aria-labelledby="guest02-title"><title id="guest02-title">A wedding guest in a periwinkle suit</title><style>.piece-guest02 :where(path,rect,circle,ellipse){stroke:var(--color-accent, #B0306B);stroke-width:var(--ba-line-w,1.5px);stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}.guest02-skin{fill:var(--skin, #5E3B28)}.guest02-hair{fill:var(--hair, #2B2118)}.guest02-suit{fill:color-mix(in oklab, var(--color-water-deep, #6F8FDB) 32%, #fff)}.guest02-shirt{fill:color-mix(in oklab, var(--color-paper, #FFFFFF) 32%, #fff)}.guest02-tie{fill:var(--color-accent, #B0306B)}.guest02-pants{fill:color-mix(in oklab, var(--color-ink, #1F2F6B) 32%, #fff)}.guest02-glow{fill:var(--color-glow, #FFE08A);opacity:var(--scene-glow,0);stroke:none}.guest02-hatch{fill:none;stroke-width:1px;opacity:.55}.guest02-wave{fill:none;stroke:var(--color-water-deep, #6F8FDB)}</style><defs></defs><g transform="translate(12 8)"><circle cx="24" cy="17" r="10" class="guest02-skin"/><path d="M13.5 16 A10.5 10.5 0 0 1 34.5 16 Q24 8.5 13.5 16 Z" class="guest02-hair"/><rect x="14" y="66" width="9" height="24" rx="3" class="guest02-pants"/><rect x="25" y="66" width="9" height="24" rx="3" class="guest02-pants"/><ellipse cx="18.5" cy="91" rx="7" ry="3.5" class="guest02-pants"/><ellipse cx="29.5" cy="91" rx="7" ry="3.5" class="guest02-pants"/><rect x="11" y="28" width="26" height="42" rx="9" class="guest02-suit"/><rect x="3" y="30" width="9" height="32" rx="4.5" class="guest02-suit"/><rect x="36" y="30" width="9" height="32" rx="4.5" class="guest02-suit"/><circle cx="7.5" cy="64" r="4" class="guest02-skin"/><circle cx="40.5" cy="64" r="4" class="guest02-skin"/><path d="M19 28 L24 42 L29 28 Z" class="guest02-shirt"/><path d="M22.5 33 L25.5 33 L26.5 44 L24 48 L21.5 44 Z" class="guest02-tie"/></g></svg>