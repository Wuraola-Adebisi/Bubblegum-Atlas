<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 112" role="img" aria-labelledby="avgroom-title"><title id="avgroom-title">A groom in a tuxedo with a bow tie and a flower, who walks as you scroll</title><style>.avgroom-skin{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--skin, #C68A62))}.avgroom-skin-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--skin, #C68A62) 86%, var(--color-ink, #1F2F6B)))}.avgroom-skin-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--skin, #C68A62) 60%, #fff))}.avgroom-hair{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--hair, #2B2118))}.avgroom-hair-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--hair, #2B2118) 86%, var(--color-ink, #1F2F6B)))}.avgroom-hair-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--hair, #2B2118) 60%, #fff))}.avgroom-jacket{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-ink, #1F2F6B))}.avgroom-jacket-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-ink, #1F2F6B) 86%, var(--color-ink, #1F2F6B)))}.avgroom-jacket-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-ink, #1F2F6B) 60%, #fff))}.avgroom-lapel{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-water-deep, #6F8FDB))}.avgroom-lapel-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-water-deep, #6F8FDB) 86%, var(--color-ink, #1F2F6B)))}.avgroom-lapel-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-water-deep, #6F8FDB) 60%, #fff))}.avgroom-shirt{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-paper, #FFFFFF))}.avgroom-shirt-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-paper, #FFFFFF) 86%, var(--color-ink, #1F2F6B)))}.avgroom-shirt-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-paper, #FFFFFF) 60%, #fff))}.avgroom-bow{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-accent, #B0306B))}.avgroom-bow-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-accent, #B0306B) 86%, var(--color-ink, #1F2F6B)))}.avgroom-bow-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-accent, #B0306B) 60%, #fff))}.avgroom-pants{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-ink, #1F2F6B))}.avgroom-pants-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-ink, #1F2F6B) 86%, var(--color-ink, #1F2F6B)))}.avgroom-pants-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-ink, #1F2F6B) 60%, #fff))}.avgroom-bloom{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-land-strong, #FF8FB8))}.avgroom-bloom-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-land-strong, #FF8FB8) 86%, var(--color-ink, #1F2F6B)))}.avgroom-bloom-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-land-strong, #FF8FB8) 60%, #fff))}.avgroom-glow{fill:var(--color-glow, #FFE08A);opacity:var(--scene-glow,0)}.avgroom-halo{fill:var(--color-glow, #FFE08A);opacity:calc(var(--scene-halo,0) * .45);stroke:none}</style><defs><clipPath id="avgroom-c1"><rect x="14" y="66" width="9" height="24" rx="3" /></clipPath><clipPath id="avgroom-c2"><rect x="25" y="66" width="9" height="24" rx="3" /></clipPath><clipPath id="avgroom-c3"><rect x="11" y="28" width="26" height="44" rx="9" /></clipPath><clipPath id="avgroom-c4"><rect x="3" y="30" width="9" height="32" rx="4.5" /></clipPath><clipPath id="avgroom-c5"><rect x="36" y="30" width="9" height="32" rx="4.5" /></clipPath><clipPath id="avgroom-c6"><circle cx="24" cy="31" r="2"/></clipPath><clipPath id="avgroom-c7"><circle cx="31.5" cy="40" r="2.4"/></clipPath></defs><g transform="translate(12 8)"><circle cx="24" cy="17" r="10" class="avgroom-skin"/><circle cx="24" cy="17" r="10" fill="none" stroke="var(--color-accent, #B0306B)" stroke-width="1.5px" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="M13.5 16 A10.5 10.5 0 0 1 34.5 16 Q24 8.5 13.5 16 Z" class="avgroom-hair"/><path d="M13.5 16 A10.5 10.5 0 0 1 34.5 16 Q24 8.5 13.5 16 Z" fill="none" stroke="var(--color-accent, #B0306B)" stroke-width="1.5px" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><g class="av-leg av-leg-a"><rect x="14" y="66" width="9" height="24" rx="3" class="avgroom-pants"/><rect x="14" y="66" width="9" height="24" rx="3" fill="none" stroke="var(--color-accent, #B0306B)" stroke-width="1.5px" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><ellipse cx="18.5" cy="91" rx="7" ry="3.5" class="avgroom-pants"/><ellipse cx="18.5" cy="91" rx="7" ry="3.5" fill="none" stroke="var(--color-accent, #B0306B)" stroke-width="1.5px" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></g><g class="av-leg av-leg-b"><rect x="25" y="66" width="9" height="24" rx="3" class="avgroom-pants"/><rect x="25" y="66" width="9" height="24" rx="3"