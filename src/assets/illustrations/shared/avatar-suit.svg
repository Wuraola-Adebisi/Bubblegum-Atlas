<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 112" role="img" aria-labelledby="avsuit-title"><title id="avsuit-title">A guest in a periwinkle suit who walks as you scroll</title><style>.avsuit-skin{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--skin, #5E3B28))}.avsuit-skin-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--skin, #5E3B28) 86%, var(--color-ink, #1F2F6B)))}.avsuit-skin-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--skin, #5E3B28) 60%, #fff))}.avsuit-hair{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--hair, #2B2118))}.avsuit-hair-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--hair, #2B2118) 86%, var(--color-ink, #1F2F6B)))}.avsuit-hair-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--hair, #2B2118) 60%, #fff))}.avsuit-suit{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-water-deep, #6F8FDB))}.avsuit-suit-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-water-deep, #6F8FDB) 86%, var(--color-ink, #1F2F6B)))}.avsuit-suit-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-water-deep, #6F8FDB) 60%, #fff))}.avsuit-shirt{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-paper, #FFFFFF))}.avsuit-shirt-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-paper, #FFFFFF) 86%, var(--color-ink, #1F2F6B)))}.avsuit-shirt-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-paper, #FFFFFF) 60%, #fff))}.avsuit-tie{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-accent, #B0306B))}.avsuit-tie-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-accent, #B0306B) 86%, var(--color-ink, #1F2F6B)))}.avsuit-tie-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-accent, #B0306B) 60%, #fff))}.avsuit-pants{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-ink, #1F2F6B))}.avsuit-pants-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-ink, #1F2F6B) 86%, var(--color-ink, #1F2F6B)))}.avsuit-pants-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-ink, #1F2F6B) 60%, #fff))}.avsuit-glow{fill:var(--color-glow, #FFE08A);opacity:var(--scene-glow,0)}.avsuit-halo{fill:var(--color-glow, #FFE08A);opacity:calc(var(--scene-halo,0) * .45);stroke:none}</style><defs><clipPath id="avsuit-c1"><rect x="14" y="66" width="9" height="24" rx="3" /></clipPath><clipPath id="avsuit-c2"><rect x="25" y="66" width="9" height="24" rx="3" /></clipPath><clipPath id="avsuit-c3"><rect x="11" y="28" width="26" height="42" rx="9" /></clipPath><clipPath id="avsuit-c4"><rect x="3" y="30" width="9" height="32" rx="4.5" /></clipPath><clipPath id="avsuit-c5"><rect x="36" y="30" width="9" height="32" rx="4.5" /></clipPath></defs><g transform="translate(12 8)"><circle cx="24" cy="17" r="10" class="avsuit-skin"/><circle cx="24" cy="17" r="10" fill="none" stroke="var(--color-accent, #B0306B)" stroke-width="1.5px" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="M13.5 16 A10.5 10.5 0 0 1 34.5 16 Q24 8.5 13.5 16 Z" class="avsuit-hair"/><path d="M13.5 16 A10.5 10.5 0