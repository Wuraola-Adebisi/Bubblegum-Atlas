<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 112" role="img" aria-labelledby="avbride-title"><title id="avbride-title">A bride in a white gown with a veil and a bouquet, who walks as you scroll</title><style>.avbride-skin{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--skin, #94603F))}.avbride-skin-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--skin, #94603F) 86%, var(--color-ink, #1F2F6B)))}.avbride-skin-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--skin, #94603F) 60%, #fff))}.avbride-hair{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--hair, #2B2118))}.avbride-hair-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--hair, #2B2118) 86%, var(--color-ink, #1F2F6B)))}.avbride-hair-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--hair, #2B2118) 60%, #fff))}.avbride-gown{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-paper, #FFFFFF))}.avbride-gown-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-paper, #FFFFFF) 86%, var(--color-ink, #1F2F6B)))}.avbride-gown-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-paper, #FFFFFF) 60%, #fff))}.avbride-veil{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), var(--color-paper, #FFFFFF))}.avbride-veil-s{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(--scene-halo, 0) * 38%), color-mix(in oklab, var(--color-paper, #FFFFFF) 86%, var(--color-ink, #1F2F6B)))}.avbride-veil-h{fill:color-mix(in oklab, var(--scene-night, #1E2457) calc(var(